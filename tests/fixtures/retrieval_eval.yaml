# 한국어 검색 품질 평가 세트: 가상의 면접 답변 하나와, 그 답변 뒤에 이어 물을 만한 질문 은행 질문
# (frontend/src/mocks/data/question-bank.ts의 key). 답변은 이 평가를 위해 지어낸 것이다.
# 검색은 그 직군의 승인된 질문 전체(모든 역량·차수, 질문과 꼬리질문 예시)에서 하고, expected 중 하나가
# 상위 3개 안에 들면 적중이다 (scripts/eval_retrieval.py, tests/test_bge_m3.py).
# kind: term = 전문 용어·약어가 그대로 겹침, paraphrase = 같은 뜻을 다른 말로, mixed = 둘 다
pairs:
