# 비식별화 누출 검수용 합성 샘플 20건. 전부 가상 인물이며 실제 개인정보는 없다.
#
# 만든 규칙
# - 휴대전화: 010-0xxx-xxxx, 010-1xxx-xxxx (가입자에게 배정되지 않는 국번대)
# - 이메일: example.com / example.org / example.net (RFC 2606 예약 도메인)
# - 주민등록번호: 마스킹된 형태 또는 검증번호가 틀린 번호
# - 주소: 실재 시·군·구에 지어낸 도로명(솔바람길, 별빛누리길 등)
# - 학교·회사: 사전에 있는 공개 기관명, 또는 지어낸 이름(한빛대학교, 누리소프트 등)
# - 제3자 이름은 호칭이 붙은 형태로만 등장한다. 호칭 없는 제3자 이름은 NER 도입 후 범위.
#
# identity: 지원서에서 이미 알고 있는 본인 정보 (KnownIdentity)
# expected: 본문에 등장하는 식별 값 정답 목록. 비식별화 후 하나도 남으면 안 된다.
#   부분 누출도 잡도록 주소는 도로명·건물·호수처럼 조각으로, 이름은 이름만 따로 나온 경우도 적는다.
# keep: 식별 정보 옆의 일반 표현. 치환에 같이 먹히면 과잉 치환으로 실패한다.
samples:
  - id: S01
    kind: 자기소개
    identity:
      name: 김도윤
      phones: [010-0123-4567]
      emails: [doyoon.kim@example.com]
      birthdate: "1995-03-14"
      addresses: ["서울특별시 마포구 솔바람길 27, 101동 1203호"]
      schools: [한빛대학교]
      companies: ["(주)누리소프트"]
    text: >-
      안녕하세요. 백엔드 개발자로 지원한 김도윤입니다. 한빛대학교 컴퓨터공학과를 졸업하고
      (주)누리소프트에서 4년간 결제 시스템을 개발했습니다. 연락처는 010-0123-4567,
      이메일은 doyoon.kim@example.com입니다.
    expected:
      - {category: candidate, value: 김도윤}
      - {category: school, value: 한빛대학교}
      - {category: company, value: 누리소프트}
      - {category: phone, value: 010-0123-4567}
      - {category: email, value: doyoon.kim@example.com}
    keep: [컴퓨터공학과를 졸업하고, 결제 시스템, 백엔드 개발자로]

  - id: S02
    kind: 면접 답변
    identity:
      name: 이서연
      schools: [서울대학교]
      companies: [네이버]
    text: >-
      네이버 검색팀에 있을 때 박준혁 팀장님과 배포 일정 때문에 의견이 갈린 적이 있습니다.
      팀장님은 일정을 지키자고 하셨고, 저는 테스트를 더 하자고 했습니다. 결국 정민지 선배님이
      중재해 주셔서 단계적 배포로 합의했습니다. 그때 팀원들이 저를 서연 님이라고 부르면서
      리뷰를 꼼꼼히 해 줬던 게 기억에 남습니다.
    expected:
      - {category: company, value: 네이버}
      - {category: person, value: 박준혁}
      - {category: person, value: 정민지}
      - {category: candidate, value: 서연}
    keep: [검색팀에, 팀장님과, 선배님이]

