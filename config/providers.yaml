# PoC 기본값: GCP. 구성요소마다 impl을 바꾸면 코드 수정 없이 교체된다.
# impl 이름 -> 클래스 매핑은 src/interview_assistant/providers/registry.py 참조.
providers:
  llm:
    primary:
      impl: anthropic_vertex
      model: claude-opus-5-5
      region: global
    screening:
      impl: anthropic_vertex
      model: claude-haiku-5-5
      region: global
    # 대안: { impl: gemini_vertex } / { impl: vllm, base_url: http://... , model: qwen3-32b } / { impl: samsung_gauss }
  stt:
    streaming:
      impl: google_stt_v2
      model: chirp_3
      language: ko-KR
    batch:
      impl: google_stt_v2
      model: chirp_3
      language: ko-KR
      diarization: true
    # 대안: { impl: faster_whisper, model: large-v3 } / { impl: clova_speech }
  # 임베딩: 로컬 BGE-M3(밀집 + 희소). 모델 파일은 관리자 화면의 "다운로드"로 받는다.
  embedding:
    impl: bge_m3
    model: bge-m3
    # 대안: { impl: vertex_embedding, model: gemini-embedding-001 }(사내 GCP, 구현 전)
  diarization:
    impl: google_stt_v2
    # 대안: { impl: pyannote }
  # 서류 읽기 (관리자 > 모델 설정 > 서류 읽기). OCR 모델 파일은 관리자 화면의 "다운로드"로 받는다.
  documents:
    ocr:
      impl: paddleocr
      model: ppocrv5-mobile
    pdf:
      impl: pdfplumber
    hwp:
      impl: syhwp
    legacy:
      impl: libreoffice
    reading:
      impl: standard
      mode: auto
      embedded_images: true
      sensitivity: medium
    # 대안: ocr { impl: tesseract, model: best } / { impl: google_document_ai } / { impl: clova_ocr }(외부)
