# 실행 위치 미정, 사내 오픈소스 모델 우선 (2026-10-28). 구성요소마다 impl을 바꾸면 코드 수정 없이 교체된다.
# impl 이름 -> 클래스 매핑은 src/interview_assistant/providers/registry.py 참조.
# 이 파일은 처음 시작할 때 비어 있는 역할만 채운다. 그 뒤로는 관리자 > 모델 설정에서 바꾼다.
providers:
  llm:
    # 사내에 설치한 오픈소스 모델 서버(vLLM·Ollama·SGLang). OpenAI 형식 API를 쓰지만 OpenAI 서비스로는
    # 보내지 않는다(openai.com 주소는 거부). 주소와 모델은 예시: 실제 사내 서버로 바꾼다.
    # 모델 비교와 작업별 권장은 docs/reference/llm.md, 설정법은 docs/ai-models.md.
    primary:
      impl: open_model_server
      base_url: http://vllm.internal:8000/v1
      model: skt/A.X-3.1
      # api_key_env: IA_LLM_API_KEY   # 서버가 키를 요구할 때. 키 값은 환경변수에만 둔다.
    screening:
      impl: open_model_server
      base_url: http://vllm.internal:8000/v1
      model: skt/A.X-3.1
    # 사내 LLM(예: samsung_gauss)이나 사내 게이트웨이도 OpenAI 형식 API를 주면 open_model_server로 붙는다.
    # 쓰지 않는 대안: { impl: anthropic_vertex, model: claude-opus-5-5, region: global }
    #   Google Cloud(회사 밖)의 Claude. GCP를 쓰지 않기로 해서(2026-10-28) 구현하지 않았다.
  # STT: 로컬 Whisper(faster-whisper, CPU int8). 음성은 서버 밖으로 나가지 않는다. 모델 파일은 관리자 화면의
  # "다운로드"로 받는다(받기 전에는 그 역할이 전사하지 않는다). GPU가 없으면 실시간은 small로 빠르게, 기록은
  # STT 사후 large-v3 + 면접 뒤 녹음 재전사로 정확하게 나눈다(docs/audio-input.md 8·10장). GPU가 생기면 실시간을
  # medium 이상으로(provider에 device 옵션을 더해야 한다).
  stt:
    streaming:
      impl: faster_whisper
      model: small
      language: ko-KR
      beam_size: 1
    batch:
      impl: faster_whisper
      model: large-v3
      language: ko-KR
      beam_size: 5
      retranscribe: true
    # 외부 클라우드 대안(승인 시, 구현 전): { impl: google_stt_v2, model: chirp_3 }(Google, 회사 밖) / { impl: clova_speech }
    #   google_stt_v2는 2026-10-21 "PoC는 GCP" 때의 기본값이었고 2026-10-28 GCP를 철회하며 바꿨다.
  # 임베딩: 로컬 BGE-M3(밀집 + 희소). 모델 파일은 관리자 화면의 "다운로드"로 받는다.
  # int8(0.59GB)이 권장: fp32보다 답변 임베딩 1.6~2.7배 빠르고 메모리 0.6GB 적으며, 검색 차이는 평가 세트 37개 중
  # 1개(docs/embedding-benchmark.md "int8 양자화"). 이 값은 새 DB의 첫 기동에만 쓰이고, 이미 적용한 설정은 그대로다.
  embedding:
    impl: bge_m3
    model: bge-m3-int8
    # 대안: { model: bge-m3 }(fp32 공식 원본 2.29GB) / { impl: vertex_embedding, model: gemini-embedding-001 }(외부 클라우드 Google, 구현 전)
  diarization:
    impl: google_stt_v2
    # 대안: { impl: pyannote }
  # 서류 읽기 (관리자 > 모델 설정 > 서류 읽기). OCR 모델 파일은 관리자 화면의 "다운로드"로 받는다.
  documents:
    ocr:
      impl: paddleocr
      model: ppocrv5-mobile
    pdf:
      impl: pdfplumber
    hwp:
      impl: syhwp
    legacy:
      impl: libreoffice
    reading:
      impl: standard
      mode: auto
      embedded_images: true
      sensitivity: medium
    # 대안: ocr { impl: tesseract, model: best } / { impl: google_document_ai } / { impl: clova_ocr }(외부)
  # 음성 입력(마이크, docs/audio-input.md). Silero VAD는 faster-whisper에 들어 있다. Smart Turn 모델 파일(8.7MB)은
  # 관리자 화면의 "다운로드"로 받는다. 받기 전에는 침묵 2초로 답변 끝을 판정하고 화면에 TURN-MISSING을 띄운다.
  audio:
    vad:
      impl: silero
      threshold: 0.5
    turn:
      impl: smart_turn
      model: smart-turn-v3.2-cpu
      pause_ms: 1000
      threshold: 0.8
      max_silence_ms: 3000
    denoise:
      impl: "off"
    # 대안: turn { impl: silence, silence_ms: 2000 } / denoise { impl: rnnoise }(구현 전)
