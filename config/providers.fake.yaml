# 자격증명 없이 로컬 실행·테스트할 때 쓰는 설정. IA_PROVIDERS_FILE=config/providers.fake.yaml
# fake LLM은 앱의 프롬프트에 규칙으로 답하고(providers/fake_tasks.py), fake STT는 시뮬레이션된 지원자
# 음성(텍스트)을 받아 적는다. speed: 1이면 프론트 모의 모드와 비슷한 속도, 0이면 지연 없음.
providers:
  llm:
    primary:
      impl: fake
      model: fake-llm
      speed: 1
    screening:
      impl: fake
      model: fake-llm-screening
      speed: 1
  stt:
    streaming:
      impl: fake
      language: ko-KR
      speed: 1
    batch:
      impl: fake
      language: ko-KR
      diarization: true
  # fake 임베딩은 단어·두 글자 조각 해시라 같은 단어를 쓴 문장끼리만 가깝다. 실제 검색은 관리자 화면에서 BGE-M3로.
  embedding:
    impl: fake
    dimensions: 256
  diarization:
    impl: fake
  # 서류 읽기: fake OCR은 글자를 읽지 않고 자리 표시 한 줄만 돌려준다. 실제 OCR은 관리자 화면에서 PaddleOCR로 바꾼다.
  documents:
    ocr:
      impl: fake
    reading:
      impl: standard
      mode: auto
