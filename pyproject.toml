[project]
name = "interview-assistant"
version = "0.1.0"
description = "AI interview assistant: JD-based screening, live interview support, scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "cryptography>=43",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "python-multipart>=0.0.32",
    # HWP 5.x (MIT; pinned: documents/hwp.py walks its record tree) and OLE containers (BSD)
    "syhwp==0.0.8",
    "olefile>=0.47",
    # Vectors in memory for retrieval (question bank, rubric anchors); see retrieval/.
    "numpy>=2.0",
]

[project.optional-dependencies]
gcp = [
    "anthropic[vertex]",
    "google-cloud-speech>=2.27",
]
# Local STT on CPU (faster-whisper, MIT). Weights are downloaded from the admin screen.
whisper = [
    "faster-whisper>=1.2.1",
]
# Local embeddings on CPU (BGE-M3 ONNX export, MIT; ONNX Runtime MIT, tokenizers Apache-2.0). The
# same packages faster-whisper already brings. Weights are downloaded from the admin screen.
embedding = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
# Local OCR on CPU (PaddleOCR PP-OCRv5, Apache-2.0). paddlepaddle stays at 3.2.x: 3.3.1's oneDNN
# path fails on Windows CPUs (docs/document-reading.md). Models come from the admin screen.
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx2",
    "reportlab>=5.0.1",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
